spring:
  datasource:
    url: jdbc:h2:mem:acme;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    ignore-migration-patterns: "*:missing"
app:
  jwt:
    secret: test-secret-key-must-be-at-least-32-chars
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:4200
  seed:
    enabled: false
    hr-email: hr.manager@acme.example
    hr-password: ChangeMe!Acme2026
