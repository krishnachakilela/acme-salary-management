services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acme_salary
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: ${DB_PASSWORD:-acme_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acme_salary"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/acme_salary
      DB_USER: acme
      DB_PASSWORD: ${DB_PASSWORD:-acme_secret}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      SEED_ON_START: "true"
      SEED_EMPLOYEE_COUNT: "10000"
      SEED_HR_EMAIL: ${SEED_HR_EMAIL:-hr.manager@acme.example}
      SEED_HR_PASSWORD: ${SEED_HR_PASSWORD:-ChangeMe!Acme2026}
      CORS_ALLOWED_ORIGINS: http://localhost:9080,http://localhost:4200
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  ui:
    build: ./frontend
    ports:
      - "9080:80"
    depends_on:
      - api

volumes:
  pgdata:
